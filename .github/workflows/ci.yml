name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  lint-and-vuln:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Unit & Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Tests with Race Detector and Coverage
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate Coverage Report
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "### 📊 Test Coverage: $COVERAGE" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | grep -v total | while read -r line; do
            PKG=$(echo "$line" | awk '{print $1}')
            PCT=$(echo "$line" | awk '{print $3}')
            echo "| \`$PKG\` | **$PCT** |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build:
    name: Multi-Arch Binary Build
    needs: [lint-and-vuln, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Binary (${{ matrix.os }}/${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/pulsefit-${{ matrix.os }}-${{ matrix.arch }} main.go
          chmod +x dist/pulsefit-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsefit-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/pulsefit-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 14

  docker:
    name: Docker Build & Healthcheck Probe
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pulsefit:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Execution & Healthcheck
        run: |
          docker run -d --name pulsefit-test -p 8099:8099 pulsefit:ci-test
          sleep 3
          curl -f --retry 5 --retry-delay 1 http://127.0.0.1:8099/healthz || (docker logs pulsefit-test && exit 1)
          docker stop pulsefit-test
          docker rm pulsefit-test
