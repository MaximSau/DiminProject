services:
  pulsefit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsefit-app
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - PULSEFIT_ADDR=0.0.0.0:8099
      - PULSEFIT_DATA=/data
      - PULSEFIT_AI_KEY=${PULSEFIT_AI_KEY:-}
    volumes:
      - ./data:/data
