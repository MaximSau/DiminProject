{{define "content"}}
<div class="card" style="text-align: center; padding: 60px 20px; max-width: 560px; margin: 40px auto;">
  <div style="font-size: 52px; font-weight: 800; color: var(--danger-text); line-height: 1; margin-bottom: 16px;">500</div>
  <h1 style="font-size: 28px; margin-bottom: 8px;">Что-то пошло не так</h1>
  <p class="small muted" style="margin-bottom: 24px; line-height: 1.6;">
    Произошла внутренняя ошибка при обработке запроса. Мы уже зафиксировали детали в журнале сервера. Попробуйте обновить страницу или вернуться на главную.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
    <a href="/dashboard" class="btn" style="width: auto; padding: 12px 24px;">На главную</a>
    <button type="button" class="btn secondary" style="width: auto; padding: 12px 20px;" onclick="window.location.reload()">Обновить страницу</button>
  </div>
</div>
{{end}}
