{{define "content"}}
<div class="card" style="text-align: center; padding: 60px 20px; max-width: 560px; margin: 40px auto;">
  <div style="font-size: 52px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 16px;">404</div>
  <h1 style="font-size: 28px; margin-bottom: 8px;">Страница не найдена</h1>
  <p class="small muted" style="margin-bottom: 24px; line-height: 1.6;">
    Возможно, ссылка устарела или адрес был введён с опечаткой. Перейдите на главную страницу, чтобы продолжить тренировки и следить за планом.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
    <a href="/dashboard" class="btn" style="width: auto; padding: 12px 24px;">На главную</a>
    <a href="/catalog" class="btn secondary" style="width: auto; padding: 12px 20px;">В базу знаний</a>
  </div>
</div>
{{end}}
